apiVersion: batch/v1
kind: Job
metadata:
  name: mlflow-registry-bootstrap
  annotations:
    checkov.io/skip1: CKV_K8S_38=EKS Pod Identity requires a projected Kubernetes service-account token.
  namespace: mlops
  labels:
    app.kubernetes.io/name: mlflow-registry-bootstrap
    app.kubernetes.io/component: experiment-tracking
    app.kubernetes.io/part-of: enterprise-mlops-platform
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-registry-bootstrap
        app.kubernetes.io/component: experiment-tracking
        app.kubernetes.io/part-of: enterprise-mlops-platform
    spec:
      restartPolicy: OnFailure
      serviceAccountName: mlflow
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry-bootstrap
          image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/enterprise-mlops-mlflow@sha256:7b842f1a8f2796893d0d2e95b8aa3a5f2448e58244c3eba7b71a1e00be4cd30e
          imagePullPolicy: Always
          command:
            - python
            - /mlflow/bootstrap_mlflow_registry.py
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlops.svc.cluster.local:5000
            - name: MODEL_ARTIFACT_URI
              value: s3://enterprise-mlops-platform-dev-931058976119/mlflow/1/models/m-6493a0a3d79345bba4a9f17592ab3642/artifacts
            - name: MODEL_NAME
              value: customer-churn-model
            - name: MODEL_ALIAS
              value: candidate
            - name: HOME
              value: /tmp/mlflow
            - name: TMPDIR
              value: /tmp/mlflow
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: temporary-storage
              mountPath: /tmp/mlflow
      volumes:
        - name: temporary-storage
          emptyDir:
            sizeLimit: 1Gi

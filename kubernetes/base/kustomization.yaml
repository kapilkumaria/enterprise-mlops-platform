apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mlops
resources:
  - namespace.yaml
  - churn-api-serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - mlflow-serviceaccount.yaml
  - storageclass-gp3.yaml
  - mlflow-pvc.yaml
  - mlflow-deployment.yaml
  - mlflow-registry-bootstrap.yaml
  - mlflow-service.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
    includeTemplates: true

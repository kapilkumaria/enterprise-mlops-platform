apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: 000000000000.dkr.ecr.us-east-1.amazonaws.com/enterprise-mlops-api
    newName: 931058976119.dkr.ecr.us-east-1.amazonaws.com/enterprise-mlops-platform-dev-api
    digest: sha256:2dceae040e0fd2f5e130b312a276b1a087578142d1e01923149ed10160652d49
  - name: 000000000000.dkr.ecr.us-east-1.amazonaws.com/enterprise-mlops-mlflow
    newName: 931058976119.dkr.ecr.us-east-1.amazonaws.com/enterprise-mlops-platform-dev-mlflow
    digest: sha256:7b842f1a8f2796893d0d2e95b8aa3a5f2448e58244c3eba7b71a1e00be4cd30e
labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: false
    includeTemplates: true
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: churn-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: churn-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

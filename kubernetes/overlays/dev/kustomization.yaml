apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: 000000000000.dkr.ecr.us-east-1.amazonaws.com/enterprise-mlops-api
    newName: 931058976119.dkr.ecr.us-east-1.amazonaws.com/enterprise-mlops-platform-dev-api
    digest: sha256:2d48f8360dd2b6cc1a79a18703458f0c7e2d0d5ab806313aec7de2cc5958807a
  - name: 000000000000.dkr.ecr.us-east-1.amazonaws.com/enterprise-mlops-mlflow
    newName: 931058976119.dkr.ecr.us-east-1.amazonaws.com/enterprise-mlops-platform-dev-mlflow
    digest: sha256:a214b332ec52447e5fe9ef046772656226088344320dc7231bea9827f79be79f
labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: false
    includeTemplates: true
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: churn-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: churn-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

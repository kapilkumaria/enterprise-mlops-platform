apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: 000000000000.dkr.ecr.us-east-1.amazonaws.com/enterprise-mlops-api
    newName: 931058976119.dkr.ecr.us-east-1.amazonaws.com/enterprise-mlops-platform-dev-api
    digest: sha256:380128be5300c78d73ff5d8f4c7b845d1cbdc558a7a68d2f74eaf8c61b9904b0
  - name: 000000000000.dkr.ecr.us-east-1.amazonaws.com/enterprise-mlops-mlflow
    newName: 931058976119.dkr.ecr.us-east-1.amazonaws.com/enterprise-mlops-platform-dev-mlflow
    digest: sha256:59e082cf38097c3c6036b28cc368d97d3e72a6e2f961d33baa0a387ebdd626a5
labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: false
    includeTemplates: true
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: churn-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: churn-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
